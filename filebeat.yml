filebeat.inputs:
- type: log
  id: geoserver-filestream
  enabled: true
  paths:
    - /var/geoserver/logs/*.log
  tags: ["geoserver", "logs", "log", "env1"]
  fields:
    app_context: geoserver_logs
    type: geoserver-logs
  fields_under_root: true

  multiline:
    type: pattern
    pattern: '^\d{2} \w{3} \d{2}:\d{2}:\d{2}'
    negate: true
    match: after

- type: log
  id: audit-filestream
  enabled: true
  paths:
    - /var/geoserver/audits/*.log
  tags: ["geoserver", "audit", "env1"]
  fields:
    app_context: geoserver_audit_logs
    type: geoserver-audit
  fields_under_root: true

output.logstash:
  hosts: ["172.17.0.1:9601"]
  index: filebeat-env1

